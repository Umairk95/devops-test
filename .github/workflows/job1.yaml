name: Queue Workflows Example

on: [push, pull_request]

jobs:
  job1:
    runs-on: ubuntu-latest
    concurrency:
      group: workflow-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Run Job 1
        run: echo "Running Job 1"

  job2:
    runs-on: ubuntu-latest
    concurrency:
      group: workflow-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Run Job 2
        run: echo "Running Job 2"

  job3:
    runs-on: ubuntu-latest
    concurrency:
      group: workflow-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Run Job 3
        run: echo "Running Job 3"
