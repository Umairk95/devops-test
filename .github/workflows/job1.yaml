name: Queue Workflows Example

on:
  push:
    branches:
      - main

jobs:
  job1:
    runs-on: ubuntu-latest
    concurrency:
      group: workflow-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Wait 
        run: sleep 60
      - name: Run Job 1  
        run: echo "Running Job 1"
  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Run Job 2
        run: echo "Running Job 2 "

