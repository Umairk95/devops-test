name: Queue Workflows Example

on:
  push:
    branches:
      - main

jobs:
  job1:
    runs-on: ubuntu-latest
    concurrency:
      group: workflow-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Wait
        run: sleep 60
      - name: Run Job 1  
        run: echo "Running Job 1"

