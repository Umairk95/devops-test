name: First Workflow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Simulate a successful step
        run: echo "This step succeeds"

      - name: Simulate a failure
        run: exit 1  # This step fails, but the second workflow should still run

      - name: This step won't run
        run: echo "This won't run because the previous step failed"
