name: Queue Workflows Example 22

on:
  push:
    branches:
      - job3

jobs:
  job1:
    runs-on: ubuntu-latest
    concurrency:
      group: main
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Wait
        run: sleep 60
      - name: Run Job 1
        run: echo "Running Job 1"
